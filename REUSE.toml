# DESCRIPTION: Verilator default licensing for "reuse lint"

version = 1

[[annotations]]
path = [
    "**/.clang-format",
    "**/.gitattributes",
    "**/.gitignore",
    ".clang-tidy",
    ".codacy.yml",
    ".devcontainer/devcontainer.json",
    ".github/**",
    ".pre-commit-hooks.yaml",
    ".style.yapf",
    "CITATION.cff",
    "CPPLINT.cfg",
    "ci/docker/buildenv/wavetools.conf",
    "docs/CONTRIBUTORS",
    "docs/spelling.txt",
    "docs/verilated.dox",
    "examples/**/*.vc",
    "install-sh",
    "test_regress/.gdbinit",
    "test_regress/input.vc",
    "test_regress/input.xsim.vc",
    "test_regress/t/*.dat",
    "test_regress/t/*.gprof",
    "test_regress/t/*.mem",
    "test_regress/t/*.out",
    "test_regress/t/*.tree",
    "test_regress/t/*.vc",
    "test_regress/t/t_lint_bsspace_bad.v",
    "verilator.pc.in",
]
SPDX-FileCopyrightText = "2003-2026 Wilson Snyder"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [
    "docs/_static/**",
    "docs/gen/*.rst",
    "docs/guide/figures/**",
]
SPDX-FileCopyrightText = "2003-2026 Wilson Snyder"
SPDX-License-Identifier = "LGPL-3.0-only OR Artistic-2.0"

[[annotations]]
path = "include/vhdl/ieee/**"
SPDX-FileCopyrightText = "2019 IEEE P1076 WG Authors"
SPDX-License-Identifier = "Apache-2.0"

# The two context declarations of IEEE Std 1076-2008 clause 16.9, which the
# working group's package release does not carry, written out here as every
# other simulator writes them.
[[annotations]]
path = [
    "include/vhdl/ieee/ieee_bit_context.vhdl",
    "include/vhdl/ieee/ieee_std_context.vhdl",
]
SPDX-FileCopyrightText = "2026 Wilson Snyder"
SPDX-License-Identifier = "LGPL-3.0-only OR Artistic-2.0"

# The four packages Synopsys published in 1990-1992 and every simulator
# ships beside the IEEE ones, unmodified. Their own notice allows use and
# distribution without restriction so long as it is kept, so it is kept.
[[annotations]]
path = [
    "include/vhdl/ieee/std_logic_arith.vhdl",
    "include/vhdl/ieee/std_logic_misc.vhdl",
    "include/vhdl/ieee/std_logic_misc-body.vhdl",
    "include/vhdl/ieee/std_logic_signed.vhdl",
    "include/vhdl/ieee/std_logic_unsigned.vhdl",
]
SPDX-FileCopyrightText = "1990-1992 Synopsys, Inc."
SPDX-License-Identifier = "LicenseRef-Synopsys-STD-LOGIC"

[[annotations]]
path = "test_regress/t/uvm/**"
SPDX-FileCopyrightText = [
    "2010-2017 Mentor Graphics Corporation",
    "2010-2013 Synopsys, Inc.",
    "2010-2018 Cadence Design Systems, Inc.",
    "2013 NVIDIA Corporation",
]
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "include/gtkwave/lz4.*"
SPDX-FileCopyrightText = "2011-2023 Yann Collet"
SPDX-License-Identifier = "BSD-2-Clause"
